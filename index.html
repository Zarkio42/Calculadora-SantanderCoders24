<!doctype html>
<html lang="pt-br">

<head>
    <title>Calculadora JS Pro</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    
    <div class="background-anim"></div>

    <main class="d-flex align-items-center justify-content-center vh-100">
        <div class="calculator-grid">
            
            <div class="output">
                <div data-previous-operand class="previous-operand"></div>
                <div data-current-operand class="current-operand">0</div>
            </div>

            <button class="span-two btn-action" data-all-clear>AC</button>
            <button class="btn-action" data-delete>DEL</button>
            <button class="btn-operator" data-operation>÷</button>
            
            <button data-number>7</button>
            <button data-number>8</button>
            <button data-number>9</button>
            <button class="btn-operator" data-operation>*</button>
            
            <button data-number>4</button>
            <button data-number>5</button>
            <button data-number>6</button>
            <button class="btn-operator" data-operation>-</button>
            
            <button data-number>1</button>
            <button data-number>2</button>
            <button data-number>3</button>
            <button class="btn-operator" data-operation>+</button>
            
            <button data-number>,</button>
            <button data-number>0</button>
            <button class="span-two btn-equal" data-equals>=</button>
        </div>
    </main>

    <script src="./js/index.js"></script>
</body>
</html>
